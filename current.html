<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman | Current</title>
    <link rel="icon" href="mybwphoto.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --color-high: #e8d8c9;
            --color-level: #4b607f;
            --color-feel: #f3701e;
            --color-bg: #0a0a0a;
            --color-text: #e8d8c9;
            --color-text-dim: #9a9a9a;
        }
        
        html {
            height: 100%;
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            font-size: 16px;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(232, 216, 201, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232, 216, 201, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: -1;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 80px;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out forwards;
        }
        
        .page-title {
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            color: var(--color-high);
            text-shadow: 0 0 20px rgba(232, 216, 201, 0.3);
        }
        
        .subtitle {
            font-size: 16px;
            color: var(--color-text-dim);
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--color-level);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateX(-20px);
            animation: slideInLeft 0.8s ease-out 0.3s forwards;
        }
        
        .back-link:hover {
            color: var(--color-feel);
            transform: translateX(-5px);
        }
        
        .back-link::before {
            content: '←';
            margin-right: 8px;
        }
        
        .activities-section {
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out 0.2s forwards;
        }
        
        .activity-item {
            position: relative;
            margin-bottom: 30px;
            padding: 25px;
            background: rgba(232, 216, 201, 0.05);
            border: 1px solid rgba(232, 216, 201, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .activity-item:hover {
            background: rgba(232, 216, 201, 0.08);
            border-color: var(--color-level);
            transform: translateX(5px);
        }
        
        .activity-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--color-feel);
            border-radius: 0 3px 3px 0;
        }
        
        .activity-text {
            font-size: 17px;
            line-height: 1.8;
            color: var(--color-text);
        }
        
        .activity-link {
            color: var(--color-feel);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
        }
        
        .activity-link:hover {
            color: var(--color-high);
            border-bottom-color: var(--color-high);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-dim);
            font-size: 15px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease-out 0.4s forwards;
        }
        
        .empty-state::before {
            content: '...';
            display: block;
            font-size: 48px;
            color: var(--color-level);
            margin-bottom: 20px;
            line-height: 1;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 40px 15px;
            }
            
            .back-link {
                position: relative;
                top: 0;
                left: 0;
                display: block;
                margin-bottom: 40px;
            }
            
            .activity-item {
                padding: 20px;
            }
            
            .activity-text {
                font-size: 16px;
            }
        }
        
        /* Zen-inspired floating elements */
        .floating-accent {
            position: fixed;
            width: 2px;
            height: 40px;
            background: linear-gradient(to bottom, transparent, var(--color-level), transparent);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        .floating-accent:nth-child(1) {
            top: 30%;
            right: 15%;
            animation-delay: 0s;
        }
        
        .floating-accent:nth-child(2) {
            top: 70%;
            left: 10%;
            animation-delay: 3s;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="floating-accent"></div>
    <div class="floating-accent"></div>
    
    <a href="https://amanjaiswl.github.io/me/" class="back-link">Back to Home</a>
    
    <div class="container">
        <header class="header">
            <h1 class="page-title">Current Activities</h1>
            <p class="subtitle">What I'm Working On</p>
        </header>
        
        <div class="activities-section">
            <div class="activity-item">
                <div class="activity-text">
                    Documenting my life <a href="https://www.youtube.com/@bestofaman" target="_blank" class="activity-link">@bestofaman</a>
                </div>
            </div>
            
            <div class="empty-state">
                More activities coming soon
            </div>
        </div>
    </div>
</body>
</html>
